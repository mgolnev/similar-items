services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-similar}
      - POSTGRES_USER=${POSTGRES_USER:-similar}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-similar}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - similar_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgresql://similar:similar@postgres:5432/similar?sslmode=disable
      - FEED_SYNC_INTERVAL=${FEED_SYNC_INTERVAL:-1h}
      - FEED_URL=${FEED_URL:?Set FEED_URL in .env}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  similar_postgres_data:
